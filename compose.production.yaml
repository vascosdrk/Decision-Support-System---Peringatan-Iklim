# ==============================================================================
# DSS-PIK BMKG Kepulauan Riau — OFFICIAL PRODUCTION DOCKER COMPOSE (v1.0.0)
# Target: BMKG Office Ubuntu Server (Docker Engine + Docker Compose v2)
#
# CRITICAL SAFETY & SECURITY POLICIES:
# 1. MariaDB port 3306 is NEVER published to the host or office LAN.
# 2. CEWS_DOCKER_LOCAL_ONLY is strictly FALSE in production.
# 3. Default ingress binds strictly to 127.0.0.1:8000 behind a reverse proxy
#    (Nginx/Caddy with TLS). Do NOT bind 0.0.0.0 unless explicitly approved.
# 4. NEVER run `docker compose down -v` during routine maintenance or upgrades
#    (that command permanently destroys the MariaDB database volume!).
# ==============================================================================

name: dss-pik-prod

services:
  mariadb:
    image: mariadb:11.4
    container_name: dss_pik_prod_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${CEWS_DB_NAME:-cews_db}
      MARIADB_USER: ${CEWS_DB_USER:-dsspik_prod}
      MARIADB_PASSWORD: ${CEWS_DB_PASSWORD:?Set CEWS_DB_PASSWORD in .env.production}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env.production}
      TZ: Asia/Jakarta
    volumes:
      - dss_pik_prod_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dss_pik_prod_internal

  app:
    image: dss-pik:${DSS_PIK_VERSION:-1.0.0}
    container_name: dss_pik_prod_app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # Default: loopback-only behind reverse proxy (Nginx/Caddy).
      # Technician may configure DSS_PIK_BIND_IP & DSS_PIK_HOST_PORT in .env.production.
      - "${DSS_PIK_BIND_IP:-127.0.0.1}:${DSS_PIK_HOST_PORT:-8000}:8000"
    environment:
      CEWS_DB_HOST: mariadb
      CEWS_DB_PORT: 3306
      CEWS_DB_NAME: ${CEWS_DB_NAME:-cews_db}
      CEWS_DB_USER: ${CEWS_DB_USER:-dsspik_prod}
      CEWS_DB_PASSWORD: ${CEWS_DB_PASSWORD:?Set CEWS_DB_PASSWORD in .env.production}
      CEWS_SERVE_FRONTEND: "true"
      CEWS_PORT: 8000
      # SECURITY: NEVER enable CEWS_DOCKER_LOCAL_ONLY in production
      CEWS_DOCKER_LOCAL_ONLY: "false"
      DSS_PIK_USERNAME: ${DSS_PIK_USERNAME:-klimatkepri}
      DSS_PIK_PASSWORD_HASH: ${DSS_PIK_PASSWORD_HASH:?Set DSS_PIK_PASSWORD_HASH in .env.production}
      DSS_PIK_SESSION_SECRET: ${DSS_PIK_SESSION_SECRET:?Set DSS_PIK_SESSION_SECRET in .env.production}
      TZ: Asia/Jakarta
    volumes:
      # Immutable canonical reference & historical datasets (READ-ONLY)
      - ${DSS_PIK_DATA_DIR:-./data}:/app/data:ro
      # Persistent writable volumes for generated operational outputs & logs
      - dss_pik_prod_maps_output:/app/data/operational/maps
      - dss_pik_prod_sih3_output:/app/data/output
      - dss_pik_prod_runtime_logs:/app/logs/runtime
      - dss_pik_prod_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - dss_pik_prod_internal

volumes:
  dss_pik_prod_mariadb_data:
    name: dss_pik_prod_mariadb_data
  dss_pik_prod_maps_output:
    name: dss_pik_prod_maps_output
  dss_pik_prod_sih3_output:
    name: dss_pik_prod_sih3_output
  dss_pik_prod_runtime_logs:
    name: dss_pik_prod_runtime_logs
  dss_pik_prod_outputs:
    name: dss_pik_prod_outputs

networks:
  dss_pik_prod_internal:
    name: dss_pik_prod_internal
    driver: bridge
